[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eris"
version = "0.1.0"
description = "Eris: A modular library for protein structural representations and graph-based encoders."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "KrenAI-Lab", email = "krenai@umag.cl" }
]

keywords = [
  "protein",
  "structural-biology",
  "graph-neural-networks",
  "geometric-deep-learning",
  "bioinformatics",
  "machine-learning",
  "voxel",
  "point-cloud",
  "protein-graphs"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "tqdm",
  "typer>=0.9",
  "rich",
  "gemmi",
  "platformdirs",
]

[project.scripts]
eris = "eris.cli.main:app"

[project.optional-dependencies]
gearnet = [
  "numpy>=1.26,<2",
  "torch==2.11.0",
  "torchdrug==0.2.1",
  "torch-scatter==2.1.2",
  "torch-cluster==1.6.3",
  "rdkit-pypi==2022.9.5",
  "ninja>=1.11,<2"
]

pyg = [
  "torch",
  "torch-geometric"
]

plm = [
  "torch",
  "transformers"
]

mesh = [
  "trimesh",
  "pyvista"
]

dev = [
  "pytest",
  "ruff",
  "build",
  "pre-commit",
  "tomli>=1.1; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/kren-ai-lab/MORPHEO"
Repository = "https://github.com/kren-ai-lab/MORPHEO"
Documentation = "https://github.com/kren-ai-lab/MORPHEO"
Issues = "https://github.com/kren-ai-lab/MORPHEO/issues"
Changelog = "https://github.com/kren-ai-lab/MORPHEO/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
