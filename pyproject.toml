[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morpheo"
version = "0.1.0"
description = "Morpheo: A modular library for protein structural representations and graph-based encoders."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "KrenAI-Lab", email = "krenai@umag.cl" }
]

keywords = [
  "protein",
  "structural-biology",
  "graph-neural-networks",
  "geometric-deep-learning",
  "bioinformatics",
  "machine-learning",
  "voxel",
  "point-cloud",
  "protein-graphs"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "tqdm",
  "typer>=0.9",
  "rich"
]

[project.scripts]
morpheo = "morpheo.cli.main:app"

[project.optional-dependencies]
pyg = [
  "torch",
  "torch-geometric"
]

plm = [
  "torch",
  "transformers"
]

mesh = [
  "trimesh",
  "pyvista"
]

dev = [
  "pytest",
  "ruff",
  "build",
  "pre-commit"
]

[project.urls]
Homepage = "https://github.com/kren-ai-lab/MORPHEO"
Repository = "https://github.com/kren-ai-lab/MORPHEO"
Documentation = "https://github.com/kren-ai-lab/MORPHEO"
Issues = "https://github.com/kren-ai-lab/MORPHEO/issues"
Changelog = "https://github.com/kren-ai-lab/MORPHEO/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
