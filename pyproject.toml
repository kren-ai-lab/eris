[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erislib"
dynamic = ["version"]
description = "Eris: A modular library for protein structural representations and graph-based encoders."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kren AI Lab", email = "krenai@umag.cl" },
]
keywords = [
    "protein",
    "structural-biology",
    "graph-neural-networks",
    "geometric-deep-learning",
    "bioinformatics",
    "machine-learning",
    "voxel",
    "point-cloud",
    "protein-graphs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "aaindex>=1.3.2,<2",
    "biotite>=1.6,<2",
    "gemmi>=0.7,<1",
    "numpy>=2.0,<3",
    "platformdirs>=4.0,<5",
    "polars>=1.44,<2",
    "rich>=13.0,<16",
    "typer>=0.27,<1",
]

[project.scripts]
eris = "eris.cli.main:main"

[project.optional-dependencies]
gearnet = ["torch>=2.11,<3"]
pyg = [
    "torch>=2.11,<3",
    "torch-geometric>=2.6,<3",
]

[project.urls]
Homepage = "https://github.com/kren-ai-lab/eris"
Repository = "https://github.com/kren-ai-lab/eris"
Issues = "https://github.com/kren-ai-lab/eris/issues"
Documentation = "https://github.com/kren-ai-lab/eris#readme"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "pyrefly>1.0",
    "taskipy>=1.14",
    "prek",
]

[tool.hatch.version]
path = "eris/_version.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.sdist]
include = ["/eris"]

[tool.hatch.build.targets.wheel]
packages = ["eris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "N803",
    "N806",
    "PLR0913",
    # Deliberate exceptions, not pending work.
    "TRY003",  # a raise names the offending data, not a class per failure mode
    "EM101",
    "EM102",
    "ANN401",  # coercion helpers take anything; `object` only moves it to pyrefly
    "PLR2004", # `if n < 3` reads better than a named constant
    "C901",    # workflows branch on contracts; splitting them hides the execution path
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"eris/cli/*" = [
    "FBT001",  # bool flags are standard in CLI functions
    "FBT002",
    "FBT003",
    "TC001",   # typer resolves annotations at runtime, so they stay imported
    "TC002",
    "TC003",
]
"eris/features/*/features_*.py" = [
    "ARG001",  # registry callbacks share one (ctx, data, params) signature
    "S106",    # `token=` is the feature name, not a secret
]
"eris/api.py" = ["TC001"]  # public signatures must resolve with typing.get_type_hints
"eris/datasets/torch_dataset.py" = ["TC003"]
"tests/*" = [
    "ANN",     # test helpers are not part of the typed public surface
    "D",       # docstrings are not required in tests
    "INP001",  # test packages are intentionally implicit namespaces
    "PLC0415",
    "PT011",
    "PT017",
    "PT018",
    "S101",    # assert is how a test asserts
    "TC003",   # pytest resolves fixture annotations at runtime
]
"examples/*" = [
    "INP001",  # example scripts are intentionally standalone modules
    "T201",    # examples print result snippets by design
]

[tool.pyrefly]
# Without a config section Pyrefly falls back to the `basic` preset, which
# silences most of its checks; `default` is the real baseline.
preset = "default"
project-includes = ["eris", "tests"]

[tool.taskipy.tasks]
sort-imports = "ruff check --fix --select I,F401 eris/ tests/"
format = "task sort-imports && ruff format eris/ tests/"
lint = "ruff check eris/ tests/"
lint-fix = "ruff check --fix eris/ tests/"
test = "pytest -q"
test-v = "pytest -v"
test-cov = "pytest --cov=eris --cov-report=html"
pyrefly = "pyrefly check eris/ tests/"
