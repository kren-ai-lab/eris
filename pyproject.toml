[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eris-lib"
version = "0.1.0"
description = "Eris: A modular library for protein structural representations and graph-based encoders."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "KrenAI-Lab", email = "krenai@umag.cl" }
]

keywords = [
  "protein",
  "structural-biology",
  "graph-neural-networks",
  "geometric-deep-learning",
  "bioinformatics",
  "machine-learning",
  "voxel",
  "point-cloud",
  "protein-graphs"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
  "aaindex>=1.3.2,<2",
  "biotite==1.6.0",
  "numpy",
  "typer>=0.9",
  "rich",
  "gemmi",
  "platformdirs",
]

[project.scripts]
eris = "eris.cli.main:app"

[project.optional-dependencies]
gearnet = [
  "torch==2.11.0"
]

pyg = [
  "torch",
  "torch-geometric"
]

dev = [
  "pytest",
  "ruff==0.16.5",
  "build",
]

[project.urls]
Homepage = "https://github.com/kren-ai-lab/Eris"
Repository = "https://github.com/kren-ai-lab/Eris"
Documentation = "https://github.com/kren-ai-lab/Eris#readme"
Issues = "https://github.com/kren-ai-lab/Eris/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
force-exclude = true
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
  "notebooks",
  "out",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
