name: Core CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m pip check

  distribution-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build --outdir dist
      - run: python -m pytest -q tests/test_m8_release_boundaries.py
      - run: python -m venv /tmp/eris-wheel-env
      - run: /tmp/eris-wheel-env/bin/python -m pip install --upgrade pip
      - run: /tmp/eris-wheel-env/bin/python -m pip install dist/*.whl
      - run: >-
          /tmp/eris-wheel-env/bin/python -c
          "import eris; from importlib.metadata import version; assert eris.__version__ == version('eris'); assert eris.list_representations(); assert eris.list_embedders() == ['gearnet_edge']"
      - run: /tmp/eris-wheel-env/bin/python -m pip check

  learned-gearnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          python -m pip install torch-scatter==2.1.2 torch-cluster==1.6.3
          --find-links https://data.pyg.org/whl/torch-2.11.0+cpu.html
      - run: python -m pip install -e ".[dev,gearnet]"
      - run: >-
          python -c
          "import eris; from eris.core.learned.backends.gearnet.dependencies import probe_gearnet_availability; assert eris.list_embedders() == ['gearnet_edge']; assert probe_gearnet_availability().available"
      - run: >-
          python -m pytest -q tests/test_gearnet_dependencies.py
          tests/test_gearnet_preprocessing_optional.py
          tests/test_gearnet_model_loading_optional.py
      - run: python -m pip check
